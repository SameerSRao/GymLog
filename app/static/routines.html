<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routines — GymLog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      padding: 24px 16px 48px;
      max-width: 520px;
      margin: 0 auto;
    }

    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .back-link {
      color: #666;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover { color: #aaa; }

    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }

    .empty-state {
      color: #444;
      font-size: 0.9rem;
      text-align: center;
      padding: 40px 0;
    }

    /* ── Routine card ───────────────────────────────────────────────────── */

    .routine-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .routine-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .routine-card-header:hover { background: #1e1e1e; }

    .routine-name { font-size: 0.95rem; font-weight: 500; }
    .routine-meta { font-size: 0.75rem; color: #555; margin-top: 3px; }

    .expand-arrow {
      color: #444;
      font-size: 1.1rem;
      transition: transform 0.15s;
    }
    .routine-card.open .expand-arrow { transform: rotate(90deg); }

    /* ── Expanded body ──────────────────────────────────────────────────── */

    .routine-body { display: none; border-top: 1px solid #222; }
    .routine-card.open .routine-body { display: block; }

    /* ── View mode ──────────────────────────────────────────────────────── */

    .ex-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-bottom: 1px solid #1f1f1f;
      font-size: 0.88rem;
    }
    .ex-row:last-child { border-bottom: none; }
    .ex-pos { color: #444; font-size: 0.75rem; width: 18px; text-align: right; flex-shrink: 0; }
    .ex-name { flex: 1; color: #ccc; }
    .ex-sets { color: #555; font-size: 0.78rem; white-space: nowrap; }

    .routine-actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #1f1f1f;
    }

    .btn-sm {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 0.82rem;
      padding: 6px 14px;
      cursor: pointer;
    }
    .btn-sm:hover { border-color: #555; color: #ccc; }
    .btn-sm.danger:hover { border-color: #6a2a2a; color: #cf6f6f; }

    /* ── Edit mode ──────────────────────────────────────────────────────── */

    .edit-panel { padding: 14px 16px; }

    .edit-label {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 5px;
      margin-top: 12px;
      display: block;
    }
    .edit-label:first-child { margin-top: 0; }

    .edit-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 0.95rem;
      padding: 8px 10px;
    }
    .edit-input:focus { outline: none; border-color: #555; }

    .edit-ex-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #1f1f1f;
    }
    .edit-ex-row:last-child { border-bottom: none; }

    .btn-reorder {
      background: none;
      border: none;
      color: #444;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-reorder:hover { color: #aaa; }
    .btn-reorder:disabled { color: #222; cursor: default; }

    .edit-ex-name { flex: 1; color: #ccc; font-size: 0.88rem; }

    .sets-input {
      width: 54px;
      background: #111;
      border: 1px solid #333;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.88rem;
      padding: 5px 7px;
      text-align: center;
    }
    .sets-input:focus { outline: none; border-color: #555; }

    .sets-label { font-size: 0.75rem; color: #555; white-space: nowrap; }

    .btn-remove {
      background: none;
      border: none;
      color: #444;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #cf6f6f; }

    /* Add exercise search */
    .add-ex-wrap { position: relative; margin-top: 10px; }

    .add-ex-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .add-ex-search {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 0.88rem;
      padding: 8px 10px;
    }
    .add-ex-search:focus { outline: none; border-color: #555; }

    .add-ex-sets {
      width: 54px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 0.88rem;
      padding: 8px 7px;
      text-align: center;
    }
    .add-ex-sets:focus { outline: none; border-color: #555; }

    .btn-add-ex {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 1.1rem;
      padding: 6px 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-add-ex:hover { border-color: #555; color: #ccc; }

    .add-ex-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 72px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .add-ex-dropdown.open { display: block; }

    .add-ex-item {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.88rem;
      border-bottom: 1px solid #222;
      color: #ccc;
    }
    .add-ex-item:last-child { border-bottom: none; }
    .add-ex-item:hover { background: #252525; }
    .add-ex-item .item-meta { font-size: 0.72rem; color: #555; margin-top: 2px; }
    .add-ex-empty { padding: 10px 12px; color: #555; font-size: 0.85rem; }

    .edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-save {
      background: #f0f0f0;
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 20px;
      cursor: pointer;
    }
    .btn-save:hover { background: #ccc; }
    .btn-save:disabled { background: #333; color: #666; cursor: default; }

    .btn-cancel {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 0.88rem;
      padding: 8px 16px;
      cursor: pointer;
    }
    .btn-cancel:hover { border-color: #555; color: #ccc; }

    /* ── Confirm modal ──────────────────────────────────────────────────── */

    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.open { display: flex; }

    .confirm-box {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 24px;
      max-width: 300px;
      width: 90%;
    }
    .confirm-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
    .confirm-msg { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 10px; }

    .btn-confirm-delete {
      flex: 1;
      background: #6a1a1a;
      border: 1px solid #8a2a2a;
      border-radius: 6px;
      color: #ff8888;
      font-size: 0.88rem;
      padding: 9px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-confirm-delete:hover { background: #7a2020; }

    .btn-confirm-cancel {
      flex: 1;
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 0.88rem;
      padding: 9px;
      cursor: pointer;
    }
    .btn-confirm-cancel:hover { border-color: #555; color: #ccc; }

    /* ── Toast ──────────────────────────────────────────────────────────── */

    #toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.9rem;
      white-space: nowrap;
      z-index: 600;
    }
    #toast.success { border-color: #2a6a2a; color: #6fcf6f; }
    #toast.error { border-color: #6a2a2a; color: #cf6f6f; }
  </style>
</head>
<body>
  <div class="page-nav">
    <a class="back-link" href="/">← GymLog</a>
    <a class="back-link" href="/log">Log Workout →</a>
  </div>

  <h1>Routines</h1>

  <div id="routine-list"></div>

  <!-- Delete confirmation modal -->
  <div id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-title">Delete Routine</div>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-btns">
        <button class="btn-confirm-delete" id="confirm-yes">Delete</button>
        <button class="btn-confirm-cancel" onclick="closeConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let allRoutines = [];
    let allExercises = [];
    let exerciseMap = {};

    // editState[routineId] = { name, exercises: [{rowId, exercise_id, name, num_sets}], nextRowId }
    const editState = {};

    // ── Init ─────────────────────────────────────────────────────────────

    async function init() {
      const [routinesRes, exRes] = await Promise.all([
        fetch('/api/routines'),
        fetch('/api/exercises'),
      ]);
      allRoutines = await routinesRes.json();
      allExercises = await exRes.json();
      exerciseMap = {};
      for (const ex of allExercises) exerciseMap[ex.name.toLowerCase()] = ex;
      render();
    }

    // ── Render list ───────────────────────────────────────────────────────

    function render() {
      const container = document.getElementById('routine-list');
      if (allRoutines.length === 0) {
        container.innerHTML =
          '<p class="empty-state">No routines saved yet.<br>' +
          'Use the <a href="/log" style="color:#5a9cf5;text-decoration:none;">log workout page</a> to save one.</p>';
        return;
      }
      container.innerHTML = allRoutines.map(r => routineCardHTML(r)).join('');
    }

    function routineCardHTML(r) {
      const date = new Date(r.created_at).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
      });
      const n = r.exercise_count;
      return `
        <div class="routine-card" id="card-${r.id}">
          <div class="routine-card-header" onclick="toggleExpand(${r.id})">
            <div>
              <div class="routine-name">${escHtml(r.name)}</div>
              <div class="routine-meta">${n} exercise${n !== 1 ? 's' : ''} · ${date}</div>
            </div>
            <span class="expand-arrow">›</span>
          </div>
          <div class="routine-body" id="body-${r.id}">
            <div id="view-${r.id}">Loading…</div>
          </div>
        </div>`;
    }

    // ── Expand / collapse ─────────────────────────────────────────────────

    async function toggleExpand(id) {
      const card = document.getElementById(`card-${id}`);
      const isOpen = card.classList.contains('open');

      // Collapse all first
      document.querySelectorAll('.routine-card.open').forEach(c => {
        c.classList.remove('open');
      });

      if (isOpen) return;

      card.classList.add('open');
      await loadDetail(id);
    }

    async function loadDetail(id) {
      const viewEl = document.getElementById(`view-${id}`);
      try {
        const res = await fetch(`/api/routine/${id}`);
        if (!res.ok) throw new Error();
        const routine = await res.json();

        // Update allRoutines entry with fresh data (exercise_count may have changed)
        const idx = allRoutines.findIndex(r => r.id === id);
        if (idx !== -1) {
          allRoutines[idx] = {
            ...allRoutines[idx],
            name: routine.name,
            exercise_count: routine.exercises.length,
            created_at: routine.created_at,
          };
        }

        viewEl.innerHTML = viewModeHTML(routine);
      } catch {
        viewEl.innerHTML = '<p style="padding:14px 16px;color:#555;font-size:0.85rem;">Failed to load.</p>';
      }
    }

    function viewModeHTML(routine) {
      const exercises = routine.exercises.length === 0
        ? '<p style="padding:12px 16px;color:#444;font-size:0.85rem;">No exercises in this routine.</p>'
        : routine.exercises.map(ex => `
            <div class="ex-row">
              <span class="ex-pos">${ex.position}</span>
              <span class="ex-name">${escHtml(ex.name)}</span>
              <span class="ex-sets">${ex.num_sets} set${ex.num_sets !== 1 ? 's' : ''}</span>
            </div>`).join('');

      return `
        ${exercises}
        <div class="routine-actions">
          <button class="btn-sm" onclick="enterEdit(${routine.id})">Edit</button>
          <button class="btn-sm danger" onclick="confirmDelete(${routine.id}, '${escAttr(routine.name)}')">Delete</button>
        </div>`;
    }

    // ── Edit mode ─────────────────────────────────────────────────────────

    async function enterEdit(id) {
      // Fetch fresh detail if not already available
      const res = await fetch(`/api/routine/${id}`);
      if (!res.ok) { showToast('Failed to load routine', 'error'); return; }
      const routine = await res.json();

      let rowId = 0;
      editState[id] = {
        name: routine.name,
        exercises: routine.exercises.map(ex => ({
          rowId: rowId++,
          exercise_id: ex.exercise_id,
          name: ex.name,
          num_sets: ex.num_sets,
        })),
        nextRowId: rowId,
      };

      renderEditMode(id);
    }

    function renderEditMode(id) {
      const viewEl = document.getElementById(`view-${id}`);
      const st = editState[id];
      const n = st.exercises.length;

      const rows = st.exercises.map((ex, i) => `
        <div class="edit-ex-row" id="edit-ex-row-${id}-${ex.rowId}">
          <button class="btn-reorder" onclick="moveExUp(${id}, ${ex.rowId})" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn-reorder" onclick="moveExDown(${id}, ${ex.rowId})" ${i === n - 1 ? 'disabled' : ''}>↓</button>
          <span class="edit-ex-name">${escHtml(ex.name)}</span>
          <input class="sets-input" type="number" min="1" value="${ex.num_sets}"
            onchange="updateSets(${id}, ${ex.rowId}, this.value)" />
          <span class="sets-label">sets</span>
          <button class="btn-remove" onclick="removeEditEx(${id}, ${ex.rowId})" title="Remove">✕</button>
        </div>`).join('');

      viewEl.innerHTML = `
        <div class="edit-panel">
          <span class="edit-label">Routine name</span>
          <input class="edit-input" type="text" id="edit-name-${id}" value="${escAttr(st.name)}"
            oninput="editState[${id}].name = this.value" />

          <span class="edit-label" style="margin-top:16px;">Exercises</span>
          <div id="edit-ex-list-${id}">
            ${rows}
          </div>

          <div class="add-ex-wrap" id="add-ex-wrap-${id}">
            <div class="add-ex-row">
              <input class="add-ex-search" id="add-ex-input-${id}" type="text"
                placeholder="Search exercises to add…"
                autocomplete="off"
                oninput="filterAddSearch(${id}, this.value)"
                onblur="setTimeout(() => closeAddDropdown(${id}), 150)"
                onfocus="filterAddSearch(${id}, this.value)" />
              <input class="add-ex-sets" type="number" min="1" value="3"
                id="add-ex-sets-${id}" placeholder="3" />
              <button class="btn-add-ex" onclick="addEditEx(${id})" title="Add">+</button>
            </div>
            <div class="add-ex-dropdown" id="add-ex-dd-${id}"></div>
          </div>

          <div class="edit-actions">
            <button class="btn-save" id="save-btn-${id}" onclick="saveEdit(${id})">Save</button>
            <button class="btn-cancel" onclick="cancelEdit(${id})">Cancel</button>
          </div>
        </div>`;
    }

    function moveExUp(id, rowId) {
      const exs = editState[id].exercises;
      const i = exs.findIndex(e => e.rowId === rowId);
      if (i <= 0) return;
      [exs[i - 1], exs[i]] = [exs[i], exs[i - 1]];
      renderEditMode(id);
    }

    function moveExDown(id, rowId) {
      const exs = editState[id].exercises;
      const i = exs.findIndex(e => e.rowId === rowId);
      if (i < 0 || i >= exs.length - 1) return;
      [exs[i], exs[i + 1]] = [exs[i + 1], exs[i]];
      renderEditMode(id);
    }

    function updateSets(id, rowId, val) {
      const ex = editState[id].exercises.find(e => e.rowId === rowId);
      if (ex) ex.num_sets = parseInt(val) || 1;
    }

    function removeEditEx(id, rowId) {
      editState[id].exercises = editState[id].exercises.filter(e => e.rowId !== rowId);
      renderEditMode(id);
    }

    // ── Add exercise search ───────────────────────────────────────────────

    // Each routine's edit mode tracks a pending selection separately
    const addExPending = {}; // routineId → { exercise_id, name } | null

    function filterAddSearch(id, query) {
      addExPending[id] = null;
      const dd = document.getElementById(`add-ex-dd-${id}`);
      const q = query.toLowerCase().trim();
      const matches = allExercises
        .filter(ex => !q || ex.name.toLowerCase().includes(q))
        .slice(0, 40);

      if (matches.length === 0) {
        dd.innerHTML = '<div class="add-ex-empty">No exercises found</div>';
      } else {
        dd.innerHTML = matches.map(ex => {
          const meta = [ex.equipment, ex.muscle_groups.slice(0, 2).map(m => m.name).join(', ')]
            .filter(Boolean).join(' · ');
          return `<div class="add-ex-item"
              onmousedown="selectAddEx(${id}, ${ex.id}, '${escAttr(ex.name)}')">
              ${escHtml(ex.name)}
              <div class="item-meta">${escHtml(meta)}</div>
            </div>`;
        }).join('');
      }
      dd.classList.add('open');
    }

    function selectAddEx(id, exerciseId, name) {
      addExPending[id] = { exercise_id: exerciseId, name };
      const inp = document.getElementById(`add-ex-input-${id}`);
      if (inp) inp.value = name;
      closeAddDropdown(id);
    }

    function closeAddDropdown(id) {
      const dd = document.getElementById(`add-ex-dd-${id}`);
      if (dd) dd.classList.remove('open');
    }

    function addEditEx(id) {
      const pending = addExPending[id];
      if (!pending) {
        showToast('Select an exercise from the list first', 'error');
        return;
      }
      const setsInput = document.getElementById(`add-ex-sets-${id}`);
      const numSets = parseInt(setsInput.value) || 3;
      const st = editState[id];
      st.exercises.push({
        rowId: st.nextRowId++,
        exercise_id: pending.exercise_id,
        name: pending.name,
        num_sets: numSets,
      });
      addExPending[id] = null;
      renderEditMode(id);
    }

    // ── Save / cancel ─────────────────────────────────────────────────────

    async function saveEdit(id) {
      const st = editState[id];
      const name = st.name.trim();
      if (!name) { showToast('Routine name cannot be empty', 'error'); return; }

      const btn = document.getElementById(`save-btn-${id}`);
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const payload = {
        name,
        exercises: st.exercises.map((ex, i) => ({
          exercise_id: ex.exercise_id,
          position: i + 1,
          num_sets: ex.num_sets,
        })),
      };

      try {
        const res = await fetch(`/api/routine/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (res.status === 409) {
          showToast(`A routine named "${name}" already exists`, 'error');
          return;
        }
        if (!res.ok) throw new Error();

        showToast(`"${name}" updated`, 'success');
        delete editState[id];

        // Update allRoutines and re-render card header
        const updated = await fetch(`/api/routine/${id}`).then(r => r.json());
        const idx = allRoutines.findIndex(r => r.id === id);
        if (idx !== -1) {
          allRoutines[idx] = {
            id: updated.id,
            name: updated.name,
            exercise_count: updated.exercises.length,
            created_at: updated.created_at,
          };
        }

        // Re-render just this card's header text
        const card = document.getElementById(`card-${id}`);
        const nameEl = card.querySelector('.routine-name');
        const metaEl = card.querySelector('.routine-meta');
        const n = updated.exercises.length;
        const date = new Date(updated.created_at).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
        });
        if (nameEl) nameEl.textContent = updated.name;
        if (metaEl) metaEl.textContent =
          `${n} exercise${n !== 1 ? 's' : ''} · ${date}`;

        // Show view mode
        const viewEl = document.getElementById(`view-${id}`);
        if (viewEl) viewEl.innerHTML = viewModeHTML(updated);

      } catch {
        showToast('Failed to save routine', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
      }
    }

    async function cancelEdit(id) {
      delete editState[id];
      await loadDetail(id);
    }

    // ── Delete ────────────────────────────────────────────────────────────

    let pendingDeleteId = null;

    function confirmDelete(id, name) {
      pendingDeleteId = id;
      document.getElementById('confirm-msg').textContent =
        `"${name}" will be permanently deleted.`;
      document.getElementById('confirm-overlay').classList.add('open');
      document.getElementById('confirm-yes').onclick = executeDelete;
    }

    function closeConfirm() {
      pendingDeleteId = null;
      document.getElementById('confirm-overlay').classList.remove('open');
    }

    async function executeDelete() {
      const id = pendingDeleteId;
      closeConfirm();
      if (!id) return;

      try {
        const res = await fetch(`/api/routine/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();

        allRoutines = allRoutines.filter(r => r.id !== id);
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
        if (allRoutines.length === 0) render();
        showToast('Routine deleted', 'success');
      } catch {
        showToast('Failed to delete routine', 'error');
      }
    }

    // ── Toast ─────────────────────────────────────────────────────────────

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escAttr(str) {
      return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    // Close add-exercise dropdown on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('.add-ex-wrap')) {
        document.querySelectorAll('.add-ex-dropdown.open')
          .forEach(dd => dd.classList.remove('open'));
      }
    });

    // Close confirm modal on overlay click
    document.getElementById('confirm-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('confirm-overlay')) closeConfirm();
    });

    init();
  </script>
</body>
</html>
