<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog — Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 32px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 16px;
    }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: #444; }

    button {
      width: 100%;
      background: #f0f0f0;
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
    }
    button:hover { background: #ccc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      color: #e05555;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #555;
    }
    .login-link a {
      color: #888;
      text-decoration: none;
    }
    .login-link a:hover { color: #f0f0f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GymLog</div>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Choose a username" autofocus autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password" />
    <label for="signup-code">Signup Code</label>
    <input type="password" id="signup-code" placeholder="Enter invite code" autocomplete="off" />
    <button id="btn">Create account</button>
    <div class="error" id="error"></div>
    <div class="login-link">Already have an account? <a href="/login">&larr; Sign in</a></div>
  </div>

  <script>
    if (localStorage.getItem('access_token')) {
      window.location.replace('/');
    }

    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const codeEl = document.getElementById('signup-code');
    const btn = document.getElementById('btn');
    const errorEl = document.getElementById('error');

    function validateInputs(username, password) {
      if (!/^[a-zA-Z0-9_\-]{3,30}$/.test(username)) {
        return 'Username must be 3–30 characters: letters, numbers, _ or -.';
      }
      if (password.length < 3 || password.length > 72) {
        return 'Password must be 3–72 characters.';
      }
      if (!/^[\x20-\x7E]+$/.test(password)) {
        return 'Password contains invalid characters.';
      }
      return null;
    }

    async function register() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      const signup_code = codeEl.value.trim();
      if (!username || !password || !signup_code) return;
      const validationError = validateInputs(username, password);
      if (validationError) { errorEl.textContent = validationError; return; }
      btn.disabled = true;
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, signup_code }),
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          window.location.replace('/');
        } else if (res.status === 409) {
          errorEl.textContent = 'That username is already taken.';
          usernameEl.select();
        } else if (res.status === 400) {
          errorEl.textContent = 'Invalid signup code.';
          codeEl.value = '';
          codeEl.focus();
        } else {
          errorEl.textContent = 'Something went wrong. Try again.';
        }
      } catch {
        errorEl.textContent = 'Something went wrong. Try again.';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', register);
    [usernameEl, passwordEl, codeEl].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
    });
  </script>
</body>
</html>
