<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      padding: 24px 16px 48px;
      max-width: 520px;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .site-logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f0f0f0;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .site-logo:hover { color: #ccc; }
    .site-nav { display: flex; gap: 8px; }
    .site-nav a {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 0.85rem;
      padding: 7px 12px;
      text-decoration: none;
    }
    .site-nav a:hover { border-color: #555; color: #ccc; }
    .site-nav a.active { border-color: #555; color: #f0f0f0; }

    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-log {
      display: block;
      background: #f0f0f0;
      color: #0f0f0f;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 32px;
    }
    .btn-log:hover { background: #ccc; }

    .section-title {
      font-size: 0.72rem;
      color: #444;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .session-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 8px;
      text-decoration: none;
      color: inherit;
    }
    .session-row:hover { border-color: #3a3a3a; background: #1e1e1e; }

    .session-row-date { font-size: 0.9rem; color: #ccc; }
    .session-row-meta { font-size: 0.78rem; color: #555; margin-top: 2px; }
    .session-row-arrow { color: #333; font-size: 1rem; }
    .session-row:hover .session-row-arrow { color: #666; }

    .empty-state {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    #loading { color: #555; font-size: 0.9rem; padding: 20px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
    </nav>
  </header>
  <script>document.querySelectorAll('.site-nav a').forEach(a => { if (a.pathname === location.pathname) a.classList.add('active'); });</script>

  <div id="loading">Loading…</div>

  <div id="content" style="display:none">
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-week">0</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">Day Streak</div>
      </div>
    </div>

    <a href="/log" class="btn-log">Log Workout</a>

    <p class="section-title">Recent Workouts</p>
    <div id="recent-list"></div>
  </div>

  <script>
    function toLocalKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay(); // 0 = Sunday
      const diff = day === 0 ? 6 : day - 1; // days since Monday
      const monday = new Date(now);
      monday.setDate(now.getDate() - diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function computeStats(sessions) {
      const total = sessions.length;

      const weekStart = getWeekStart();
      const thisWeek = sessions.filter(s => new Date(s.logged_at) >= weekStart).length;

      const loggedDates = new Set(sessions.map(s => toLocalKey(new Date(s.logged_at))));
      let streak = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      // Start from today; if today has no workout, start from yesterday so active streaks aren't broken before the day's session is logged
      const startOffset = loggedDates.has(toLocalKey(today)) ? 0 : 1;
      for (let i = startOffset; i < 365; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        if (loggedDates.has(toLocalKey(d))) {
          streak++;
        } else {
          break;
        }
      }

      return { total, thisWeek, streak };
    }

    function renderRecent(sessions) {
      const list = document.getElementById('recent-list');
      if (sessions.length === 0) {
        list.innerHTML = '<div class="empty-state">No workouts logged yet.<br>Hit "Log Workout" to get started.</div>';
        return;
      }
      list.innerHTML = sessions.slice(0, 5).map(s => {
        const date = new Date(s.logged_at);
        const dateStr = date.toLocaleDateString('en-US', {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
        });
        const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const exCount = s.exercises_logged ?? 0;
        const meta = `${exCount} exercise${exCount !== 1 ? 's' : ''} · ${timeStr}`;
        return `<a class="session-row" href="/workout/${s.session_id}">
          <div>
            <div class="session-row-date">${dateStr}</div>
            <div class="session-row-meta">${meta}</div>
          </div>
          <span class="session-row-arrow">›</span>
        </a>`;
      }).join('');
    }

    async function init() {
      try {
        const res = await fetch('/api/workouts');
        if (!res.ok) throw new Error('Failed to load workouts');
        const sessions = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const { total, thisWeek, streak } = computeStats(sessions);
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-week').textContent = thisWeek;
        document.getElementById('stat-streak').textContent = streak;

        renderRecent(sessions);
      } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load workouts.';
      }
    }

    init();
  </script>
</body>
</html>
