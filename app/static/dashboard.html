<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      padding: 24px 16px 48px;
      max-width: 520px;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .site-logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f0f0f0;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .site-logo:hover { color: #ccc; }
    .site-nav { display: flex; gap: 8px; }
    .site-nav a {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 0.85rem;
      padding: 7px 12px;
      text-decoration: none;
    }
    .site-nav a:hover { border-color: #555; color: #ccc; }
    .site-nav a.active { border-color: #555; color: #f0f0f0; }

    .nav-user {
      font-size: 0.8rem;
      color: #555;
      align-self: center;
      margin-right: 4px;
    }
    .nav-user .badge-admin {
      display: inline-block;
      background: #c0a020;
      color: #0f0f0f;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .chat-locked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 460px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      margin-bottom: 14px;
      color: #555;
      font-size: 0.9rem;
      text-align: center;
      gap: 8px;
    }
    .chat-locked .lock-icon { font-size: 2rem; }
    .chat-locked p { max-width: 260px; line-height: 1.5; }

    /* Stats */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Chat */
    .chat-window {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 460px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .msg {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-bot {
      align-self: flex-start;
      background: #242424;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .msg-user {
      align-self: flex-end;
      background: #f0f0f0;
      color: #0f0f0f;
      border-bottom-right-radius: 4px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      height: 16px;
    }
    .typing-dots span {
      width: 5px;
      height: 5px;
      background: #555;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #252525;
    }
    .chat-input {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.9rem;
      padding: 10px 12px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: #444; }
    .chat-input::placeholder { color: #444; }

    .chat-send {
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      color: #0f0f0f;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 16px;
      align-self: flex-end;
      flex-shrink: 0;
    }
    .chat-send:hover { background: #ccc; }
    .chat-send:disabled { background: #2a2a2a; color: #555; cursor: default; }

    /* Log button */
    .btn-log {
      display: block;
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 14px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-log:hover { border-color: #444; color: #ccc; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <span class="nav-user" id="nav-username"></span>
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
    </nav>
  </header>
  <script>document.querySelectorAll('.site-nav a').forEach(a => { if (a.pathname === location.pathname) a.classList.add('active'); });</script>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-week">—</div>
      <div class="stat-label">This Week</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-streak">—</div>
      <div class="stat-label">Day Streak</div>
    </div>
  </div>

  <div class="chat-window">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <textarea
        class="chat-input"
        id="chat-input"
        placeholder="Log a workout, check progress, ask anything…"
        rows="1"
      ></textarea>
      <button class="chat-send" id="chat-send">↑</button>
    </div>
  </div>

  <a href="/log" class="btn-log">Log Workout manually →</a>

  <script src="/static/auth.js"></script>
  <script>
    checkAuth();

    /* ── Nav username ───────────────────────────────────────────── */
    (function () {
      var name = getUsername();
      if (!name) return;
      var span = document.getElementById('nav-username');
      span.textContent = name;
      if (isAdmin()) {
        var badge = document.createElement('span');
        badge.className = 'badge-admin';
        badge.textContent = 'admin';
        span.appendChild(badge);
      }
    })();

    /* ── Chat premium gate ──────────────────────────────────────── */
    if (!isPremium() && !isAdmin()) {
      var chatWindow = document.querySelector('.chat-window');
      var locked = document.createElement('div');
      locked.className = 'chat-locked';
      locked.innerHTML = '<div class="lock-icon">🔒</div><p>AI chat is available for premium members. Upgrade to unlock GymBot.</p>';
      chatWindow.parentNode.replaceChild(locked, chatWindow);
    }

    /* ── Stats ─────────────────────────────────────────────────── */
    function toLocalKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function getWeekStart() {
      const now = new Date();
      const diff = now.getDay() === 0 ? 6 : now.getDay() - 1;
      const mon = new Date(now);
      mon.setDate(now.getDate() - diff);
      mon.setHours(0, 0, 0, 0);
      return mon;
    }
    async function loadStats() {
      try {
        const res = await authFetch('/api/workouts');
        if (!res.ok) return;
        const sessions = await res.json();
        const total = sessions.length;
        const weekStart = getWeekStart();
        const thisWeek = sessions.filter(s => new Date(s.logged_at) >= weekStart).length;
        const loggedDates = new Set(sessions.map(s => toLocalKey(new Date(s.logged_at))));
        let streak = 0;
        const today = new Date(); today.setHours(0,0,0,0);
        const startOffset = loggedDates.has(toLocalKey(today)) ? 0 : 1;
        for (let i = startOffset; i < 365; i++) {
          const d = new Date(today); d.setDate(today.getDate() - i);
          if (loggedDates.has(toLocalKey(d))) streak++; else break;
        }
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-week').textContent = thisWeek;
        document.getElementById('stat-streak').textContent = streak;
      } catch (_) {}
    }

    /* ── Chat ───────────────────────────────────────────────────── */
    const history = []; // [{role, content}]

    function appendMsg(role, text) {
      const el = document.createElement('div');
      el.className = `msg msg-${role === 'user' ? 'user' : 'bot'}`;
      el.textContent = text;
      document.getElementById('chat-messages').appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return el;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'msg msg-bot';
      el.id = 'typing-indicator';
      el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      document.getElementById('chat-messages').appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return el;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = '';
      appendMsg('user', text);
      history.push({ role: 'user', content: text });

      const sendBtn = document.getElementById('chat-send');
      sendBtn.disabled = true;
      const typingEl = showTyping();

      try {
        const res = await authFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        typingEl.remove();

        if (!res.ok) {
          appendMsg('bot', 'Something went wrong. Try again.');
          sendBtn.disabled = false;
          return;
        }

        const botEl = appendMsg('bot', '');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let botText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') break;
            try {
              const parsed = JSON.parse(payload);
              if (parsed.error) {
                botEl.textContent = 'Error: ' + parsed.error;
              } else if (parsed.text) {
                botText += parsed.text;
                botEl.textContent = botText;
                botEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
              }
            } catch (_) {}
          }
        }

        if (botText) history.push({ role: 'assistant', content: botText });
        // Refresh stats in case a workout was just logged
        loadStats();
      } catch (e) {
        typingEl.remove();
        appendMsg('bot', 'Connection error. Try again.');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    document.getElementById('chat-send').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    // Auto-resize textarea
    document.getElementById('chat-input').addEventListener('input', function () {
      this.style.height = '';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    /* ── Init ───────────────────────────────────────────────────── */
    loadStats();
    appendMsg('bot', 'Hey! I\'m GymBot. I can log workouts, check your progress, or search exercises. What\'s up?');
  </script>
</body>
</html>
