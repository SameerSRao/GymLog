<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/wide.css" />
  <link rel="stylesheet" href="/static/css/log.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <button class="btn-new-exercise" onclick="toggleCreateForm()">+ New Exercise</button>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <div id="create-form" class="exercise-block" style="display:none; margin-bottom:24px;">
    <div class="exercise-header">
      <span>Create Exercise</span>
      <button class="btn-icon" onclick="toggleCreateForm()">✕</button>
    </div>
    <label>Name</label>
    <input type="text" id="new-ex-name" placeholder="e.g. Romanian Deadlift" autocomplete="off" />
    <label>Equipment</label>
    <select id="new-ex-equipment">
      <option value="">— none / unknown —</option>
    </select>
    <label>Muscle Groups</label>
    <div id="mg-checkboxes" class="mg-checkboxes"></div>
    <button class="btn-submit" style="margin-top:16px;" onclick="createExercise()">Create Exercise</button>
  </div>

  <div id="routine-loader" style="display:none; margin-bottom:16px;">
    <select id="routine-select" onchange="onRoutineChange(this)">
      <option value="">Load Routine…</option>
    </select>
  </div>

  <div class="log-date-row">
    <label class="log-date-label" for="workout-date-input">Workout Date</label>
    <input type="date" id="workout-date-input" class="log-date-input" />
  </div>
  <div id="exercises"></div>

  <button class="btn-add-exercise" onclick="addExercise()">+ Add Exercise</button>
  <textarea id="workout-notes-input" class="notes-textarea" placeholder="Notes (optional)" rows="3"></textarea>
  <button
    class="btn-new-exercise"
    id="saveRoutineBtn"
    style="display:none; width:100%; margin-bottom:12px;"
    onclick="saveAsRoutine()"
  >Save as Routine</button>
  <button class="btn-submit" id="submitBtn" onclick="submitWorkout()">Log Workout</button>
  <div id="last-workout-link" style="text-align:center;margin-top:14px;font-size:0.88rem;"></div>

  <div id="toast"></div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/log.js"></script>
</body>
</html>
