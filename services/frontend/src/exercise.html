<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise — GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/wide.css" />
  <link rel="stylesheet" href="/static/css/exercise.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <div id="loading">Loading…</div>
  <div id="content" style="display:none">
    <div id="ex-header"></div>

    <div id="pr-banner" style="display:none" class="pr-banner">
      <span class="pr-label">PR</span>
      <span class="pr-value" id="pr-value"></span>
    </div>

    <p class="section-title">Progress</p>

    <div id="chart-section" style="display:none" class="chart-wrap">
      <div class="chart-tabs" id="chart-tabs"></div>
      <p class="chart-title" id="chart-title"></p>
      <svg id="chart" width="100%" viewBox="0 0 520 120" preserveAspectRatio="none"></svg>
    </div>

    <div id="sessions"></div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/exercise.js"></script>
</body>
</html>
