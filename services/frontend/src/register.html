<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog — Register</title>
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="card">
    <div class="logo">GymLog</div>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Choose a username" autofocus autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password" />
    <label for="signup-code">Signup Code</label>
    <input type="password" id="signup-code" placeholder="Enter invite code" autocomplete="off" />
    <button id="btn">Create account</button>
    <div class="error" id="error"></div>
    <div class="login-link">Already have an account? <a href="/login">&larr; Sign in</a></div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
