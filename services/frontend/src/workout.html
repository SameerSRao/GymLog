<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout — GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/wide.css" />
  <link rel="stylesheet" href="/static/css/workout.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <div id="loading">Loading…</div>

  <div id="content" style="display:none">
    <div class="workout-header">
      <div>
        <h1 id="workout-date"></h1>
        <p class="workout-meta" id="workout-meta"></p>
        <p class="workout-notes" id="workout-notes" style="display:none"></p>
      </div>
      <div id="view-actions" style="display:flex;gap:8px;">
        <button class="btn-edit" onclick="enterEditMode()">Edit</button>
        <button class="btn-delete" onclick="confirmDelete()">Delete</button>
      </div>
      <div id="edit-actions" style="display:none;gap:8px;">
        <button class="btn-cancel-edit" onclick="exitEditMode()">Cancel</button>
        <button class="btn-save" onclick="saveWorkout()">Save</button>
      </div>
    </div>

    <div id="exercises"></div>
    <div id="edit-exercise-container" style="display:none"></div>
    <button id="edit-add-exercise-btn" class="btn-add-exercise" onclick="addExercise()" style="display:none">+ Add Exercise</button>
    <div id="edit-datetime-row" style="display:none; margin-bottom:14px;">
      <label class="edit-label">Date &amp; Time</label>
      <div style="display:flex; gap:8px;">
        <input type="date" id="edit-date-input" class="edit-input" style="flex:1;" />
        <input type="time" id="edit-time-input" class="edit-input" style="flex:1;" />
      </div>
    </div>
    <textarea id="edit-notes" class="notes-textarea" placeholder="Notes (optional)" rows="3" style="display:none"></textarea>
  </div>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p>Delete this workout? This can't be undone.</p>
      <div class="confirm-actions">
        <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="btn-confirm-delete" onclick="deleteWorkout()">Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/workout.js"></script>
</body>
</html>
