<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 32px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 16px;
    }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: #444; }

    button {
      width: 100%;
      background: #f0f0f0;
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
    }
    button:hover { background: #ccc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .demo-btn {
      width: 100%;
      background: transparent;
      color: #888;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .demo-btn:hover { border-color: #555; color: #f0f0f0; }

    .error {
      color: #e05555;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }

    .register-link {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #555;
    }
    .register-link a {
      color: #888;
      text-decoration: none;
    }
    .register-link a:hover { color: #f0f0f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GymLog</div>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autofocus autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
    <button id="btn">Sign in</button>
    <button class="demo-btn" id="demo-btn">Try Demo</button>
    <div class="error" id="error"></div>
    <div class="register-link">New here? <a href="/register">Register &rarr;</a></div>
  </div>

  <script>
    if (localStorage.getItem('access_token')) {
      window.location.replace('/');
    }

    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const btn = document.getElementById('btn');
    const errorEl = document.getElementById('error');

    async function login() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value.trim();
      if (!username || !password) return;
      btn.disabled = true;
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          window.location.replace('/');
        } else {
          errorEl.textContent = 'Incorrect username or password.';
          passwordEl.value = '';
          usernameEl.select();
        }
      } catch {
        errorEl.textContent = 'Something went wrong. Try again.';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', login);
    [usernameEl, passwordEl].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    });

    document.getElementById('demo-btn').addEventListener('click', async function() {
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/auth/demo');
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          window.location.replace('/');
        } else {
          errorEl.textContent = 'Demo is unavailable right now.';
        }
      } catch {
        errorEl.textContent = 'Something went wrong. Try again.';
      }
    });
  </script>
</body>
</html>
