<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workouts — GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/workouts.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <a href="/import" id="nav-import" style="display:none;">Import</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="cal-header">
    <button class="cal-nav" id="prev-btn">‹</button>
    <h2 id="cal-month-label"></h2>
    <button class="cal-nav" id="next-btn">›</button>
  </div>

  <div class="cal-grid" id="cal-grid"></div>

  <div class="legend">
    <div class="legend-dot"></div>
    <span>Workout logged</span>
  </div>

  <div class="day-picker" id="day-picker"></div>

  <div class="recent-section">
    <p class="section-title">Recent Workouts</p>
    <div id="recent-list"></div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/workouts.js"></script>
</body>
</html>
