<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import — GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/import.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <h1>Import Workouts</h1>
  <p class="subtitle">Paste a JSON array of workout sessions to bulk-import history.</p>

  <label for="json-input">JSON payload</label>
  <textarea id="json-input" placeholder='[
  {
    "logged_at": "2025-01-10T09:00:00",
    "exercises": [
      {
        "exercise_id": 99,
        "sets": [
          {"reps": 5, "weight_lbs": 135}
        ]
      }
    ]
  }
]'></textarea>

  <button class="btn-import" id="import-btn">Import</button>

  <div class="result" id="result"></div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/import.js"></script>
</body>
</html>
