<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-week">—</div>
      <div class="stat-label">This Week</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-streak">—</div>
      <div class="stat-label">Day Streak</div>
    </div>
  </div>

  <div class="chat-window">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <textarea
        class="chat-input"
        id="chat-input"
        placeholder="Log a workout, check progress, ask anything…"
        rows="1"
      ></textarea>
      <button class="chat-send" id="chat-send">↑</button>
    </div>
  </div>

  <a href="/log" class="btn-log">Log Workout manually →</a>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
