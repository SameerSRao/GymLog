<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routines — GymLog</title>
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/routines.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GymLog</a>
    <nav class="site-nav">
      <a href="/workouts">History</a>
      <a href="/exercises">Exercises</a>
      <a href="/routines">Routines</a>
      <div class="nav-avatar" id="nav-avatar">
        <button class="avatar-btn" id="avatar-btn"></button>
        <div class="avatar-dropdown" id="avatar-dropdown">
          <div class="avatar-dname" id="avatar-dname"></div>
          <div class="avatar-badges" id="avatar-badges"></div>
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <h1>Routines</h1>

  <div id="routine-list"></div>

  <div id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-title">Delete Routine</div>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-btns">
        <button class="btn-confirm-delete" id="confirm-yes">Delete</button>
        <button class="btn-confirm-cancel" onclick="closeConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/static/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/routines.js"></script>
</body>
</html>
